services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Your_password123"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "Your_password123", "-C", "-Q", "SELECT 1"]
      interval: 10s
      retries: 10

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
    ports:
      - "9092:9092"
      - "19092:19092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: "local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "redpanda:9092"
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.API
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__ApplicationDb: "Server=mssql;Initial Catalog=PractitionerDirectory;User ID=sa;Password=Your_password123;TrustServerCertificate=True;"
    ports:
      - "5000:8080"
    depends_on:
      mssql:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.Worker
    restart: unless-stopped
    environment:
      ConnectionStrings__ApplicationDb: "Server=mssql;Initial Catalog=PractitionerDirectory;User ID=sa;Password=Your_password123;TrustServerCertificate=True;"
      Kafka__BootstrapServers: "redpanda:9092"
    depends_on:
      mssql:
        condition: service_healthy
      redpanda:
        condition: service_healthy

volumes:
  mssql-data: